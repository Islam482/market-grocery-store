<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - Market ("Базар")</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<div class="bg-dark text-white py-1 fs-7">
    <div class="container d-flex justify-content-between align-items-center">
        <span><i class="fa-solid fa-location-dot text-warning me-1"></i> Market "Базар", Zhagalau 4, Astana</span>
        <span><i class="fa-solid fa-truck-fast text-success me-1"></i> Free express delivery over 5,000 KZT</span>
    </div>
</div>

<header class="bg-white border-bottom sticky-top shadow-sm">
    <div class="container py-2">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a href="index.html" class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
                <div class="bg-warning text-dark rounded-3 px-3 py-1 fw-bold fs-3 shadow-sm">Базар</div>
                <div>
                    <h1 class="h4 fw-bold mb-0 text-dark">MARKET</h1>
                    <p class="small text-muted mb-0" style="font-size: 0.75rem;">Online Grocery Store Astana</p>
                </div>
            </a>

            <nav class="nav nav-pills gap-1 gap-md-2">
                <a class="nav-link fw-bold" href="index.html"><i class="fa-solid fa-house me-1"></i> Home</a>
                <a class="nav-link fw-bold" href="catalog.html"><i class="fa-solid fa-store me-1"></i> Catalog</a>
                <a class="nav-link fw-bold active" href="auth.html"><i class="fa-solid fa-user me-1"></i> Login / Register</a>
                <a class="nav-link fw-bold" href="dashboard.html"><i class="fa-solid fa-chart-line me-1"></i> My Account</a>
            </nav>
        </div>
    </div>
</header>

<main class="container my-5" style="max-width: 520px;">
    <div class="card border-0 shadow-lg rounded-4 p-4">

        <div id="auth-alert" class="alert d-none mb-3" role="alert"></div>

        <ul class="nav nav-pills nav-fill mb-4" id="authTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane">Log In</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane">Create Account</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">

            <div class="tab-pane fade show active" id="login-pane">
                <h2 class="h4 fw-bold text-center mb-3">Welcome Back</h2>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="login-email" class="form-label small fw-bold">Email address</label>
                        <input type="email" class="form-control" id="login-email" placeholder="customer@mail.kz" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label small fw-bold">Password</label>
                        <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                        </div>
                        <span class="small text-muted">Demo: customer@mail.kz / 123456</span>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">Sign In to Account</button>
                </form>
            </div>

            <div class="tab-pane fade" id="register-pane">
                <h2 class="h4 fw-bold text-center mb-3">New Consumer Account</h2>
                <form id="register-form">
                    <div class="mb-3">
                        <label for="reg-name" class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="Name Surname" required>
                    </div>
                    <div class="mb-3">
                        <label for="reg-email" class="form-label small fw-bold">Email address</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="customer@mail.kz" required>
                    </div>
                    <div class="mb-3">
                        <label for="reg-password" class="form-label small fw-bold">Password</label>
                        <input type="password" class="form-control" id="reg-password" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" id="termsCheck" required>
                        <label class="form-check-label small" for="termsCheck">I accept terms & conditions of Market ("Базар")</label>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm">Register Account</button>
                </form>
            </div>

        </div>

    </div>
</main>

<footer class="bg-dark text-white p-4 mt-auto">
    <div class="container text-center">
        <p class="mb-0">&copy; 2026 Trading House "Market" ("Базар"). Zhagalau 4, Astana.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/main.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
